name: CI

# Every push and PR runs the checks. Pushes to main deploy to GitHub Pages,
# but only after every check has passed.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's image ships Node and all three browsers with their Linux
    # libraries, so CI never waits on apt or a browser download. Its tag must match
    # @playwright/test (tests/unit/ci-config.test.ts checks this).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      # Recommended by Playwright: Docker's small default shared memory crashes browsers.
      options: --ipc=host
    env:
      # The image runs as root; Firefox needs HOME to belong to that user.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install bun
        run: npm install --global bun@1.4.4
      - run: bun install --frozen-lockfile

      - name: Types, lint and formatting
        run: bun run check && bun run lint && bun run format:check
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy check
        run: bun run check:copy
        env:
          # Private copy rules (one regex per line). Not available to fork PRs.
          COPY_RULES: ${{ secrets.COPY_RULES }}

      - name: End-to-end tests
        run: bun run test:e2e
        env:
          CI: '1'
      - name: Lighthouse
        # Uses the image's Chromium; it needs --no-sandbox when running as root.
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          bunx @lhci/cli autorun --collect.settings.chromeFlags="--no-sandbox"
      - name: Lighthouse numbers
        if: always() && hashFiles('.lighthouseci/lhr-*.json') != ''
        run: bun scripts/lighthouse-summary.ts
      # Inside a container, github.workspace is the host's path; record the real one.
      - name: Find the built site
        run: echo "DIST_DIR=$PWD/dist" >> "$GITHUB_ENV"
      - name: Internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ env.DIST_DIR }} 'dist/**/*.html'
          fail: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
